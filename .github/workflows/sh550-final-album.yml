name: SH550 final album build

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/sh550-final-album.yml'
      - 'automation/sh550/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer libreoffice-calc tesseract-ocr tesseract-ocr-rus poppler-utils fonts-dejavu fonts-liberation fonts-noto-core
      - name: Install Python dependencies
        run: pip install --quiet gdown pymupdf openpyxl pillow pytesseract reportlab pypdf
      - name: Inspect source files
        run: python automation/sh550/inspect_sources.py
      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: sh550-source-inspection
          path: out/
          if-no-files-found: error
