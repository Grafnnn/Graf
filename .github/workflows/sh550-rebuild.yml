name: SH550 rebuild
on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system OCR
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-rus
      - name: Install Python
        run: pip install --quiet gdown openpyxl pypdf reportlab requests
      - name: Inspect scan 0264
        shell: bash
        run: |
          mkdir -p diagnostic
          python - <<'PY'
          import gdown, pathlib, subprocess
          gdown.download(id='1Q_6hTMAUUdrSu8BZA4pCIH2-EWv6ktbm',output='diagnostic/scan_0264.pdf',quiet=False)
          subprocess.run(['pdftoppm','-png','-r','220','diagnostic/scan_0264.pdf','diagnostic/scan'],check=True)
          texts=[]
          for img in sorted(pathlib.Path('diagnostic').glob('scan-*.png')):
              base=str(img.with_suffix(''))+'_ocr'
              subprocess.run(['tesseract',str(img),base,'-l','rus+eng'],check=False,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              txt=pathlib.Path(base+'.txt')
              content=txt.read_text(encoding='utf-8',errors='ignore') if txt.exists() else ''
              texts.append(f'\n\n===== {img.name} =====\n{content}')
          full=''.join(texts)
          pathlib.Path('diagnostic/scan_0264_ocr.txt').write_text(full,encoding='utf-8')
          print(full)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sh550-diagnostic
          path: diagnostic
          retention-days: 2
