name: SH550 clean rebuild
on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system PDF and OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils tesseract-ocr tesseract-ocr-rus fonts-dejavu-core
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade --quiet pip
          pip install --quiet gdown openpyxl pypdf reportlab pymupdf
      - name: Apply runtime patch and compile rebuild script
        shell: bash
        run: |
          sed -i 's/ws.iter_rows(min_row=2, values_only=True)/ws.iter_rows(min_row=2, max_col=len(headers), values_only=True)/' rebuild_sh550.py
          python -m py_compile rebuild_sh550.py
      - name: Build albums, registries and archives
        shell: bash
        run: |
          set -o pipefail
          python rebuild_sh550.py --output output --workers 5 2>&1 | tee build.log
          cp build.log output/release/SH550_build.log
          ls -lah output/release
      - name: Upload complete rebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: SH550_clean_rebuild
          path: output/release
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Publish downloadable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: sh550-facades-clean-rebuild-v2
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" output/release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$HEAD_SHA" \
            --title "Ш550 — чистовая пересборка исполнительной документации по фасадам" \
            --notes "Пять PDF-альбомов по вкладкам реестра, пять ZIP-архивов исходных файлов, обновленный рабочий реестр и отчет контроля. Протоколы АК-001 и АК-002 восстановлены из scan_0264.pdf после OCR-проверки."
